<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- تأكد إن الخط العربي الأساسي هو Noto Sans Arabic -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans Arabic</family>
      <family>Amiri</family>
    </prefer>
  </alias>

  <!-- للنصوص المكتوبة بخط serif -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Amiri</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>

  <!-- للأرقام والنصوص الأحادية (monospace) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <!-- تأكد إن أي خط فيه دعم للعربي يبدّله باللي فوق -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
</fontconfig>
