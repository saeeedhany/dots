# ~/.tmux.conf

##### GENERAL SETTINGS #####
set -g mouse on                  # Enable mouse control
set -g history-limit 10000       # Scrollback buffer
setw -g mode-keys vi             # Use vi-style keys in copy mode
set -g base-index 1              # Start window index from 1
setw -g pane-base-index 1
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"  # Enable true color support
set-option -g focus-events on

##### PREFIX KEY (Optional CapsLock+b alternative) #####
# Uncomment the next line if you want to use CapsLock+b as prefix
# Note: You'll need to remap CapsLock to some key first at system level
# set -g prefix C-space
# unbind C-b
# bind C-space send-prefix

##### TPM (Tmux Plugin Manager) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


##### STATUS BAR LAYOUT #####
# Colors and contents of the bar come from the active theme (bottom of file)
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom
set -g window-status-separator ""
set -g clock-mode-style 24
set -g display-panes-time 2000

##### SPLIT SHORTCUTS (VIM-STYLE) #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

##### VIM-STYLE KEYBINDINGS #####

# Navigate panes with vim keys (prefix + h/j/k/l)
bind h select-pane -L    # left
bind j select-pane -D    # down
bind k select-pane -U    # up
bind l select-pane -R    # right

# Resize panes with vim keys (prefix + H/J/K/L - capital letters)
bind -r H resize-pane -L 5    # resize left
bind -r J resize-pane -D 5    # resize down
bind -r K resize-pane -U 5    # resize up
bind -r L resize-pane -R 5    # resize right

##### SWITCH WINDOWS WITH ALT + [H/L] (keeping your original binding) #####
bind -n M-h previous-window
bind -n M-l next-window

##### RELOAD CONFIG #####
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux: config reloaded"

##### TMUX + NVIM INTEGRATION #####
# This section removed to avoid conflicts with vim keybindings

##### CLIPBOARD INTEGRATION (optional for Linux with xclip) #####
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

##### ADDITIONAL AESTHETIC ENHANCEMENTS #####
# Better copy mode styling
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# Status bar toggle
bind b set-option status

# Renumber windows when one is closed
set -g renumber-windows on

# Aggressive resize for better multi-session support
setw -g aggressive-resize on

##### TMUX CONTINUUM SETTINGS #####
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### ENHANCED NOTIFICATIONS #####
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity on
set -g bell-action none

##### TPM PLUGIN SETTINGS #####
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Run TPM
run '~/.tmux/plugins/tpm/tpm'

##### INSTALLATION AND USAGE NOTES #####
#
# NEW VIM-STYLE KEY BINDINGS:
#
# NAVIGATE PANES:
# - Ctrl+b, then h - move left
# - Ctrl+b, then j - move down
# - Ctrl+b, then k - move up
# - Ctrl+b, then l - move right
#
# RESIZE PANES (capital letters):
# - Ctrl+b, then H - resize left
# - Ctrl+b, then J - resize down
# - Ctrl+b, then K - resize up
# - Ctrl+b, then L - resize right
# (You can repeat H/J/K/L quickly for continuous resizing)
#
# OTHER KEY BINDINGS:
# - Split panes: | (vertical), - (horizontal)
# - Reload config: prefix+r
# - Toggle status bar: prefix+b
# - Alt+h/l - also switches windows (original binding kept)
#
# To install TPM plugins: prefix + I
# To save session: prefix + Ctrl-s
# To restore session: prefix + Ctrl-r

##### THEME #####
# Colors come from the active theme (run: theme <name>)
source-file -q ~/.cache/theme/tmux.conf
